add_recipe:
  name: Add Recipe
  description: Add a new recipe. Config entry is auto-detected if not specified.
  fields:
    config_entry_id:
      name: Recipe List
      description: The recipe list to add the recipe to (optional - auto-detected if only one exists).
      required: false
      selector:
        config_entry:
          integration: recipecards
    title:
      name: Title
      description: The title of the recipe
      required: true
      selector:
        text:
    description:
      name: Description
      description: A brief description of the recipe
      required: false
      selector:
        text:
    ingredients:
      name: Ingredients
      description: List of ingredients
      required: false
      selector:
        object:
    notes:
      name: Notes
      description: Additional notes about the recipe
      required: false
      selector:
        text:
          multiline: true
    instructions:
      name: Instructions
      description: Cooking instructions
      required: false
      selector:
        object:
    color:
      name: Colour
      description: Colour for the recipe card (hex format)
      required: false
      default: "#FFD700"
      selector:
        color_rgb:
    prep_time:
      name: Prep time
      description: Preparation time in minutes. Parsed from the text if omitted.
      required: false
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
          mode: box
    cook_time:
      name: Cook time
      description: Cooking time in minutes. Parsed from the text if omitted.
      required: false
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
          mode: box
    total_time:
      name: Total time
      description: Total time in minutes. Defaults to prep + cook when both are known.
      required: false
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min
          mode: box
    tags:
      name: Tags
      description: Tags for this recipe. A recipe can carry as many as you like.
      required: false
      selector:
        select:
          multiple: true
          custom_value: true
          options: []
    image:
      name: Image
      description: Image URL, or a data:image/... base64 string.
      required: false
      selector:
        text:

